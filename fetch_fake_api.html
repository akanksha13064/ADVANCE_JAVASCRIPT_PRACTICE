
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Comments</title>
</head>
<body>

    <h2>Fetch Data Using Async Await</h2>

    <button onclick="loadComments()">Click to Load</button>

    <pre id="output">Click the button to load comments.</pre>

    <script>
        async function loadComments() {
            try {
                document.getElementById("output").textContent =
                    "Loading comments...";

                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/comments"
                );

                if (!response.ok) {
                    throw new Error("Failed to load comments!");
                }

                const data = await response.json();

                let result = "HTTP Status Code: " + response.status +
                    "\nData Loaded Successfully!\n\n";

                data.forEach(comment => {
                    result += `Post ID: ${comment.postId}\n`;
                    result += `ID: ${comment.id}\n`;
                    result += `Name: ${comment.name}\n`;
                    result += `Email: ${comment.email}\n`;
                    result += `Body: ${comment.body}\n`;
                    result += "--------------------------------\n\n";
                });

                document.getElementById("output").textContent = result;

            } catch (error) {
                document.getElementById("output").textContent =
                    "Error: " + error.message;
            }
        }
    </script>

</body>
</html>
