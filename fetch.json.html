
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch JSON Example</title>
</head>
<body>
    <h2>Fetch JSON Example</h2>

    <div id="output">Click button to load JSON data</div>
    <button onclick="loadData()">Load JSON Data</button>

    <script>
        function loadData() {
            fetch("data2.json")
                .then(response => {
                    document.getElementById("output").innerHTML =
                        "HTTP status code: " + response.status;

                    if (!response.ok) {
                        throw new Error("Error loading file");
                    }

                    return response.json();
                })
                .then(data => {
                    let table = `
                        <table border="1" cellpadding="8">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Age</th>
                                    <th>City</th>
                                    <th>Skills</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    data.forEach(person => {
                        table += `
                            <tr>
                                <td>${person.name}</td>
                                <td>${person.age}</td>
                                <td>${person.city}</td>
                                <td>${person.skills.join(", ")}</td>
                            </tr>
                        `;
                    });

                    table += `
                            </tbody>
                        </table>
                    `;

                    document.getElementById("output").innerHTML = table;
                })
                .catch(error => {
                    document.getElementById("output").innerHTML =
                        "Error: " + error.message;
                });
        }
    </script>
</body>
</html>
