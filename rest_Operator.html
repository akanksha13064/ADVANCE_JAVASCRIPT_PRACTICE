    <title>Rest Operator</title>

<body>

<script>

    // Normal function

    function sum(num1, num2) {
        document.write(num1 + num2, "<br>");
    }

    sum(10, 20);
    sum(10, 20, 30); 
    // फक्त पहिले दोन parameters घेतले जातील → 30


    // Rest Operator

    function add(...numbers) {

        let sum = 0;

        for (let i in numbers) {
            sum += numbers[i];
        }

        return sum;
    }

    document.write(add(12, 56, 67, 68) + "<br>");

</script>

<script>
    function sumRest(name, course, subject, ...marks) {

        document.write(`Name ${name}<br>`);
        document.write(`Course: ${course}<br>`);
        document.write(`Subject: ${subject}<br>`);

        let sum = 0;

        for (let i in marks) {
            sum += marks[i];
        }

        document.write(`Total Marks: ${sum}<br>`);
    }

    sumRest("Akanksha", "JavaScript", "Web Development", 35, 67, 56, 89);
</script>
